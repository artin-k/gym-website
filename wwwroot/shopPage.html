<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>shop</title>

    <link rel="stylesheet" href="style-shop.css"/>
</head>
<body>

    <header class="header">
        <div class="right-section">
            <div class="off-screen-menu">
                <ul class="ham-set">
                    <li class="ham-menu-item">
                        <img src="icons/home-page-white-icon.webp" alt="home" class="home-icon">
                        <a class="ham-item" href="#">خانه</a>
                    </li>
                    <li class="ham-menu-item">
                        <img src="icons/insta-icon.png" alt="insta" class="insta-icon">
                        <a class="ham-item" href="#">تماس با ما</a>
                    </li>
                </ul>
            </div>


            <nav>
                <div class="ham-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </nav>
        </div>

        <div class="left-section">
            <div class="logo-container">
                <div class="logo">
                    <button class="login-btn" id="login-button">login</button>
                    <button class="shop-btn" id="shop-button">shop</button>

                </div>
            </div>

        </div>
    </header>

    <div id="gallery"></div>

    <h1 class="page-title">Our Products</h1>
    <div class="product-grid">
        <!-- Product Card -->
        <div class="product-card">
            <img src="uploads/product1.jpg" alt="Product 1">
            <h2>Product Title</h2>
            <p class="price">$19.99</p>
            <button class="btn">Add to Cart</button>
        </div>

        <!-- Repeat this block for other products -->
    </div>
    <script src="script-shop.js"></script>
</body>
</html>
